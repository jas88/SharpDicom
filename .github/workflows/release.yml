name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  # Build native libraries for all platforms
  build-native:
    uses: ./.github/workflows/native-build.yml
    secrets: inherit

  # Build and publish NuGet packages
  build-publish:
    runs-on: ubuntu-latest
    needs: build-native

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for MinVer

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install NuGet CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y nuget

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      # Download native artifacts from all platforms
      - name: Download linux-x64 natives
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: nuget/runtimes/linux-x64/native/

      - name: Download linux-arm64 natives
        uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: nuget/runtimes/linux-arm64/native/

      - name: Download win-x64 natives
        uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: nuget/runtimes/win-x64/native/

      - name: Download win-arm64 natives
        uses: actions/download-artifact@v4
        with:
          name: native-win-arm64
          path: nuget/runtimes/win-arm64/native/

      - name: Download osx-x64 natives
        uses: actions/download-artifact@v4
        with:
          name: native-osx-x64
          path: nuget/runtimes/osx-x64/native/

      - name: Download osx-arm64 natives
        uses: actions/download-artifact@v4
        with:
          name: native-osx-arm64
          path: nuget/runtimes/osx-arm64/native/

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded native artifacts ==="
          find nuget/runtimes -type f -ls || echo "No artifacts found"

      # Create runtime packages
      - name: Create runtime packages
        working-directory: nuget
        run: |
          VERSION=${{ steps.version.outputs.version }}

          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            echo "=== Creating SharpDicom.Codecs.runtime.$rid.$VERSION.nupkg ==="

            # Check if native library exists
            if [ -d "runtimes/$rid/native" ] && [ "$(ls -A runtimes/$rid/native)" ]; then
              nuget pack "SharpDicom.Codecs.runtime.$rid.nuspec" \
                -Version "$VERSION" \
                -Properties "version=$VERSION" \
                -OutputDirectory packages
              echo "Created package for $rid"
            else
              echo "WARNING: No native libraries for $rid, skipping package"
            fi
          done

      # Build managed packages
      - name: Restore dependencies
        run: dotnet restore

      - name: Build managed packages
        run: |
          VERSION=${{ steps.version.outputs.version }}
          dotnet build --configuration Release --no-restore
          dotnet pack src/SharpDicom/SharpDicom.csproj -c Release --no-build -o nuget/packages -p:PackageVersion=$VERSION
          dotnet pack src/SharpDicom.Codecs/SharpDicom.Codecs.csproj -c Release --no-build -o nuget/packages -p:PackageVersion=$VERSION

      - name: List created packages
        run: |
          echo "=== Created NuGet packages ==="
          ls -la nuget/packages/

      # Publish to NuGet.org
      - name: Publish to NuGet.org
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY not set, skipping NuGet publish"
            exit 0
          fi

          for pkg in nuget/packages/*.nupkg; do
            if [ -f "$pkg" ]; then
              echo "Publishing $pkg..."
              dotnet nuget push "$pkg" \
                --api-key "$NUGET_API_KEY" \
                --source https://api.nuget.org/v3/index.json \
                --skip-duplicate
            fi
          done

      # Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            nuget/packages/*.nupkg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
