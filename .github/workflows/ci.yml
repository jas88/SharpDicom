name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ZIG_VERSION: '0.13.0'
  CUDA_VERSION: '12.3.2'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      orthanc:
        image: orthancteam/orthanc:25.12.3
        ports:
          - 4242:4242  # DICOM port
          - 8042:8042  # HTTP API

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      # .NET Setup
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      # Zig Setup for native codecs
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # CUDA Setup for GPU codecs
      - name: Setup CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        id: cuda-toolkit
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: 'network'
          # Note: nvJPEG2000 uses different package naming (libnvjpeg2k0-cuda-12)
          # and cannot be installed via sub-packages parameter
          linux-local-args: '["--toolkit"]'

      - name: Install nvJPEG2000
        run: |
          # nvJPEG2000 uses non-standard package naming: libnvjpeg2k0-cuda-{major}
          # Cannot use sub-packages parameter which expects cuda-{name}-{major}-{minor} format
          sudo apt-get update
          sudo apt-get install -y libnvjpeg2k0-cuda-12 libnvjpeg2k0-dev-cuda-12 || {
            echo "⚠ nvJPEG2000 packages not available - CUDA wrapper will be skipped"
            exit 0
          }

      # DCMTK Setup for integration tests
      - name: Install DCMTK
        run: |
          sudo apt-get update
          sudo apt-get install -y dcmtk
          # Verify installation
          dcmsend --version || true
          dcmrecv --version || true
          echo "DCMTK_ROOT=/usr" >> $GITHUB_ENV

      # Build Phase 1: .NET
      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build .NET projects
        run: dotnet build --no-restore --configuration Release

      # Build Phase 2: Native codecs (Zig)
      - name: Build native codecs (all platforms)
        working-directory: native
        run: zig build

      - name: Run native codec tests
        working-directory: native
        run: zig build test

      # Build Phase 3: CUDA wrapper (if nvJPEG2000 available)
      - name: Check for nvJPEG2000
        id: nvjpeg2k-check
        run: |
          # nvJPEG2000 header can be in multiple locations depending on package installation
          NVJPEG2K_PATHS=(
            "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}/include/nvjpeg2k.h"
            "/usr/local/cuda/include/nvjpeg2k.h"
            "/usr/include/nvjpeg2k.h"
          )

          for path in "${NVJPEG2K_PATHS[@]}"; do
            if [ -f "$path" ]; then
              echo "available=true" >> $GITHUB_OUTPUT
              echo "✓ nvJPEG2000 found at $path"
              exit 0
            fi
          done

          echo "available=false" >> $GITHUB_OUTPUT
          echo "⚠ nvJPEG2000 not found in any expected location - CUDA wrapper will be skipped"

      - name: Build CUDA nvJPEG2000 wrapper
        if: steps.nvjpeg2k-check.outputs.available == 'true'
        working-directory: native/cuda
        env:
          CUDA_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCUDA_TOOLKIT_ROOT_DIR=$CUDA_PATH \
                ..
          cmake --build . --parallel

      # Test Phase: .NET tests with coverage
      - name: Test with coverage
        run: dotnet test --no-build --configuration Release --settings tests/test.runsettings -- --coverage --coverage-output-format cobertura --coverage-output $GITHUB_WORKSPACE/coverage.cobertura.xml

      # Integration Tests: Orthanc
      - name: Wait for Orthanc
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8042/system > /dev/null 2>&1; then
              echo "✓ Orthanc is ready"
              exit 0
            fi
            echo "Waiting for Orthanc... ($i/30)"
            sleep 2
          done
          echo "⚠ Orthanc may not be ready, continuing anyway"

      - name: Integration tests with Orthanc
        continue-on-error: true  # Orthanc tests are optional for now
        run: dotnet test --no-build --configuration Release --settings tests/test.runsettings --filter "Category=Orthanc"
        env:
          ORTHANC_HOST: localhost
          ORTHANC_DICOM_PORT: 4242
          ORTHANC_AE_TITLE: ORTHANC

      # Integration Tests: DCMTK
      - name: Integration tests with DCMTK
        continue-on-error: true  # DCMTK tests are optional for now
        run: dotnet test --no-build --configuration Release --settings tests/test.runsettings --filter "Category=DCMTK"
        env:
          DCMTK_ROOT: /usr

      # Upload coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ${{ github.workspace }}/coverage.cobertura.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Upload Artifacts
      - name: Upload native codec artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-codecs
          path: native/zig-out/
          retention-days: 7

      - name: Upload CUDA wrapper artifacts
        if: steps.nvjpeg2k-check.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cuda-wrapper
          path: native/cuda/build/lib/
          retention-days: 7

      # NuGet Package (on tags only)
      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet pack --no-build --configuration Release -p:PackageVersion=${GITHUB_REF_NAME#v} -warnaserror
          # Validate package was created and contains expected assemblies
          NUPKG="src/SharpDicom/bin/Release/SharpDicom.${GITHUB_REF_NAME#v}.nupkg"
          if [ ! -f "$NUPKG" ]; then
            echo "::error::Package not found: $NUPKG"
            exit 1
          fi
          echo "Package contents:"
          unzip -l "$NUPKG"
          # Verify DLLs have embedded PDBs (file size check - embedded PDBs make DLLs larger)
          unzip -p "$NUPKG" "lib/net9.0/SharpDicom.dll" > /tmp/check.dll
          if [ $(stat -c%s /tmp/check.dll 2>/dev/null || stat -f%z /tmp/check.dll) -lt 100000 ]; then
            echo "::error::DLL suspiciously small - may be missing embedded symbols"
            exit 1
          fi
          echo "::notice::Package validated successfully"

      - name: Push to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "src/**/bin/Release/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
