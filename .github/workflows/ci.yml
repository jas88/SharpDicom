name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ZIG_VERSION: '0.13.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    services:
      orthanc:
        image: orthancteam/orthanc:25.12.3
        ports:
          - 4242:4242  # DICOM port
          - 8042:8042  # HTTP API

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      # .NET Setup
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      # Zig Setup for native codecs
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # Install packages with caching
      - name: Cache and install apt packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: dcmtk libcharls-dev libcharls2 lld llvm cmake libtiff-dev libboost-program-options-dev
          version: 1.7
          execute_install_scripts: true

      # ccache for native C/C++ builds
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 500M
          key: native-builds

      # Build OpenJPH from source (openjph-tools not available in Noble 24.04)
      - name: Build and install OpenJPH
        run: |
          git clone --depth 1 --branch 0.26.0 https://github.com/aous72/OpenJPH.git /tmp/openjph
          cmake -S /tmp/openjph -B /tmp/openjph/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build /tmp/openjph/build --parallel $(nproc)
          sudo cmake --install /tmp/openjph/build
          sudo ldconfig

      # Build charls-tools from source (cjpls/djpls CLI)
      - name: Build and install charls-tools
        run: |
          git clone --depth 1 https://github.com/malaterre/charls-tools.git /tmp/charls-tools
          cmake -S /tmp/charls-tools -B /tmp/charls-tools/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build /tmp/charls-tools/build --target cjpls djpls --parallel $(nproc)
          sudo install /tmp/charls-tools/build/cjpls /usr/local/bin/
          sudo install /tmp/charls-tools/build/djpls /usr/local/bin/

      # xwin for Linux-to-Windows AOT cross-compilation
      - name: Setup xwin
        run: |
          curl -sSfL https://github.com/Jake-Shadle/xwin/releases/download/0.7.0/xwin-0.7.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          mv xwin-0.7.0-x86_64-unknown-linux-musl/xwin /usr/local/bin/
          xwin --version

      - name: Verify package installations
        run: |
          # DCMTK - required for interop tests
          dcmsend --version
          dcmrecv --version

          # CharLS tools - required for JPEG-LS conformance tests
          which cjpls
          which djpls

          # OpenJPH - required for HTJ2K conformance tests
          which ojph_compress
          which ojph_expand

          echo "DCMTK_ROOT=/usr" >> $GITHUB_ENV

      - name: Start DCMTK services for integration tests
        run: |
          # Create output directory for received DICOM files
          mkdir -p /tmp/dcmtk-received

          # Start storescp on port 11120 (for C-STORE SCU tests)
          storescp -v -od /tmp/dcmtk-received 11120 > /tmp/storescp-11120.log 2>&1 &

          # Start storescp on port 11113 (for C-ECHO tests)
          storescp -v 11113 > /tmp/storescp-11113.log 2>&1 &

          # Give services time to start
          sleep 2

          # Verify they're listening
          netstat -ln | grep -E ":(11120|11113)" || echo "⚠ Some DCMTK services may not have started"

          echo "✓ DCMTK services started (storescp on ports 11120, 11113)"

      # Build Phase 1: .NET
      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build .NET projects
        run: dotnet build --no-restore --configuration Release

      # Download vendor sources for native codecs
      - name: Download vendor sources
        run: |
          cd native/vendor

          # libjpeg-turbo 3.0.4 - High-performance JPEG codec
          echo "Downloading libjpeg-turbo..."
          LIBJPEG_SHA256="0270f9496ad6d69e743f1e7b9e3e9398f5b4d606b6a47744df4b73df50f62e38"
          curl -sL https://github.com/libjpeg-turbo/libjpeg-turbo/archive/refs/tags/3.0.4.tar.gz -o libjpeg-turbo.tar.gz
          echo "${LIBJPEG_SHA256}  libjpeg-turbo.tar.gz" | sha256sum -c -
          tar xzf libjpeg-turbo.tar.gz && rm libjpeg-turbo.tar.gz
          mv libjpeg-turbo-3.0.4 libjpeg-turbo/src

          # CharLS 2.4.2 - JPEG-LS codec
          echo "Downloading CharLS..."
          CHARLS_SHA256="d1c2c35664976f1e43fec7764d72755e6a50a80f38eca70fcc7553cad4fe19d9"
          curl -sL https://github.com/team-charls/charls/archive/refs/tags/2.4.2.tar.gz -o charls.tar.gz
          echo "${CHARLS_SHA256}  charls.tar.gz" | sha256sum -c -
          tar xzf charls.tar.gz && rm charls.tar.gz
          mv charls-2.4.2 charls/src

          # OpenJPEG 2.5.3 - JPEG 2000 codec
          echo "Downloading OpenJPEG..."
          OPENJPEG_SHA256="368fe0468228e767433c9ebdea82ad9d801a3ad1e4234421f352c8b06e7aa707"
          curl -sL https://github.com/uclouvain/openjpeg/archive/refs/tags/v2.5.3.tar.gz -o openjpeg.tar.gz
          echo "${OPENJPEG_SHA256}  openjpeg.tar.gz" | sha256sum -c -
          tar xzf openjpeg.tar.gz && rm openjpeg.tar.gz
          mv openjpeg-2.5.3 openjpeg/src

          # Generate OpenJPEG config headers (normally done by CMake)
          # These need to be platform-aware for cross-compilation
          OPJ_DIR=openjpeg/src/src/lib/openjp2
          cat > $OPJ_DIR/opj_config.h << 'EOF'
          #ifndef OPJ_CONFIG_H_INCLUDED
          #define OPJ_CONFIG_H_INCLUDED
          #define OPJ_VERSION_MAJOR 2
          #define OPJ_VERSION_MINOR 5
          #define OPJ_VERSION_BUILD 3
          #endif
          EOF
          cat > $OPJ_DIR/opj_config_private.h << 'EOF'
          #define OPJ_PACKAGE_VERSION "2.5.3"
          /* Platform-specific memory allocation */
          #if defined(_WIN32) || defined(_WIN64)
            #define OPJ_HAVE__ALIGNED_MALLOC 1
          #else
            #define OPJ_HAVE_POSIX_MEMALIGN 1
            #define OPJ_HAVE_FSEEKO 1
            #define _POSIX_C_SOURCE 200112L
          #endif
          EOF

          # FFmpeg 7.1 - Video codecs (decoding + encoding)
          # NOTE: FFmpeg compilation is complex. For now we download headers only.
          # Full source compilation requires a minimal subset of files.
          echo "Downloading FFmpeg..."
          FFMPEG_SHA256="7ddad2d992bd250a6c56053c26029f7e728bebf0f37f80cf3f8a0e6ec706431a"
          curl -sL https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n7.1.tar.gz -o ffmpeg.tar.gz
          echo "${FFMPEG_SHA256}  ffmpeg.tar.gz" | sha256sum -c -
          tar xzf ffmpeg.tar.gz && rm ffmpeg.tar.gz
          # Move to ffmpeg/ (not ffmpeg/src) as config.h is at vendor/ffmpeg/config.h
          # Use cp -r and rm -rf because ffmpeg/ already has config.h
          cp -r FFmpeg-n7.1/* ffmpeg/
          rm -rf FFmpeg-n7.1

          # x264 - H.264 software encoder (for FFmpeg)
          # Pinned to specific commit for reproducible builds
          echo "Downloading x264..."
          X264_COMMIT="31e19f92f00c7003fa115047ce50978bc98c3a0d"
          X264_SHA256="d053c9d86988d6bc78237ca5205865c5ddf99c98ef4cd9927eec8f6d388f6dd9"
          curl -sL "https://code.videolan.org/videolan/x264/-/archive/${X264_COMMIT}/x264-${X264_COMMIT}.tar.gz" -o x264.tar.gz
          echo "${X264_SHA256}  x264.tar.gz" | sha256sum -c -
          tar xzf x264.tar.gz && rm x264.tar.gz
          mv x264-${X264_COMMIT}/* x264/
          rm -rf x264-${X264_COMMIT}

          # x265 3.6 - HEVC software encoder (for FFmpeg)
          echo "Downloading x265..."
          X265_SHA256="663531f341c5389f460d730e62e10a4fcca3428ca2ca109693867bc5fe2e2807"
          curl -sL https://bitbucket.org/multicoreware/x265_git/downloads/x265_3.6.tar.gz -o x265.tar.gz
          echo "${X265_SHA256}  x265.tar.gz" | sha256sum -c -
          tar xzf x265.tar.gz && rm x265.tar.gz
          mv x265_3.6/* x265/
          rm -rf x265_3.6

          # Tesseract 5.5.0 - OCR engine
          echo "Downloading Tesseract..."
          TESSERACT_SHA256="f2fb34ca035b6d087a42875a35a7a5c4155fa9979c6132365b1e5a28ebc3fc11"
          curl -sL https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.0.tar.gz -o tesseract.tar.gz
          echo "${TESSERACT_SHA256}  tesseract.tar.gz" | sha256sum -c -
          tar xzf tesseract.tar.gz && rm tesseract.tar.gz
          mv tesseract-5.5.0 tesseract/src

          # Leptonica 1.85.0 - Image processing library (Tesseract dependency)
          echo "Downloading Leptonica..."
          LEPTONICA_SHA256="c01376bce0379d4ea4bc2ec5d5cbddaa49e2f06f88242619ab8c059e21adf233"
          curl -sL https://github.com/DanBloomberg/leptonica/archive/refs/tags/1.85.0.tar.gz -o leptonica.tar.gz
          echo "${LEPTONICA_SHA256}  leptonica.tar.gz" | sha256sum -c -
          tar xzf leptonica.tar.gz && rm leptonica.tar.gz
          mv leptonica-1.85.0 leptonica/src

          # stb headers - single-header libraries (pinned to commit for reproducibility)
          # Using commit f75e8d1 from stb master
          echo "Downloading stb..."
          mkdir -p stb
          STB_COMMIT="f75e8d1cad7d90d72ef7a4661f1b994ef78b4e31"
          STB_IMAGE_SHA256="594c2fe35d49488b4382dbfaec8f98366defca819d916ac95becf3e75f4200b3"
          curl -sL "https://raw.githubusercontent.com/nothings/stb/${STB_COMMIT}/stb_image.h" -o stb/stb_image.h
          echo "${STB_IMAGE_SHA256}  stb/stb_image.h" | sha256sum -c -

          # Verify downloads
          echo "=== Vendor source directories ==="
          ls -la
          echo "=== libjpeg-turbo ==="
          ls -la libjpeg-turbo/src/*.c 2>/dev/null | head -5 || echo "libjpeg-turbo sources present"
          echo "=== CharLS ==="
          ls -la charls/src/src/*.cpp 2>/dev/null | head -5 || echo "CharLS sources present"
          echo "=== OpenJPEG ==="
          ls -la openjpeg/src/src/lib/openjp2/*.c 2>/dev/null | head -5 || echo "OpenJPEG sources present"
          echo "=== FFmpeg ==="
          ls -la ffmpeg/libavcodec/*.c 2>/dev/null | head -5 || echo "FFmpeg sources present"
          echo "=== x264 ==="
          ls -la x264/common/*.c 2>/dev/null | head -5 || echo "x264 sources present"
          echo "=== x265 ==="
          ls -la x265/source/common/*.cpp 2>/dev/null | head -5 || echo "x265 sources present"
          echo "=== Tesseract ==="
          ls -la tesseract/src/src/ccmain/*.cpp 2>/dev/null | head -5 || echo "Tesseract sources present"
          echo "=== Leptonica ==="
          ls -la leptonica/src/src/*.c 2>/dev/null | head -5 || echo "Leptonica sources present"
          echo "=== stb ==="
          ls -la stb/

      # Build Phase 2: Native codecs (Zig)
      - name: Build native codecs (all platforms)
        working-directory: native
        run: zig build

      - name: Run native codec tests
        working-directory: native
        run: zig build test

      # Build Phase 3: CUDA wrapper - DISABLED
      # TODO: Phase 22.1 - Fix CUDA nvJPEG2000 wrapper build
      # Current issue: Ubuntu libnvjpeg2k0-dev-cuda-12 package has incomplete headers
      # (missing nvjpeg2kProgOrder and nvjpeg2kQualityType type definitions)

      # Copy native libraries to test directories (built after .NET projects)
      - name: Copy native codecs to test assemblies
        run: |
          NATIVE_LIB=${{ github.workspace }}/native/zig-out/linux-x64/libsharpdicom_codecs.so
          echo "Native library: $NATIVE_LIB"
          ls -la $NATIVE_LIB || echo "Warning: Native library not found"

          # Check library dependencies
          echo "Library dependencies (ldd):"
          ldd $NATIVE_LIB || true
          echo ""

          # Copy to all test assembly directories
          for testdir in tests/*/bin/Release/net*/; do
            if [ -d "$testdir" ]; then
              echo "Copying to $testdir"
              cp -v "$NATIVE_LIB" "$testdir" 2>/dev/null || true
            fi
          done

      # Test Phase: .NET tests with coverage
      - name: Test with coverage
        run: dotnet test --no-build --configuration Release --settings tests/test.runsettings --results-directory $GITHUB_WORKSPACE/TestResults -- --coverage --coverage-output-format cobertura
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/native/zig-out/linux-x64
          SHARPDICOM_NATIVE_DEBUG: "1"

      # Integration Tests: Orthanc
      - name: Wait for Orthanc
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8042/system > /dev/null 2>&1; then
              echo "✓ Orthanc is ready"
              exit 0
            fi
            echo "Waiting for Orthanc... ($i/30)"
            sleep 2
          done
          echo "⚠ Orthanc may not be ready, continuing anyway"

      - name: Integration tests with Orthanc
        continue-on-error: true  # Orthanc tests are optional for now
        run: dotnet test --no-build --configuration Release --settings tests/test.runsettings --filter "Category=Orthanc"
        env:
          ORTHANC_HOST: localhost
          ORTHANC_DICOM_PORT: 4242
          ORTHANC_AE_TITLE: ORTHANC

      # Integration Tests: DCMTK
      - name: Integration tests with DCMTK
        run: dotnet test --no-build --configuration Release --settings tests/test.runsettings --filter "Category=DCMTK" --project tests/SharpDicom.Tests/SharpDicom.Tests.csproj
        env:
          DCMTK_ROOT: /usr
          LD_LIBRARY_PATH: ${{ github.workspace }}/native/zig-out/linux-x64

      # Upload coverage
      - name: Collect coverage files
        id: coverage
        run: |
          FILES=$(find $GITHUB_WORKSPACE/TestResults -name '*.cobertura.xml' -printf '%p,' 2>/dev/null | sed 's/,$//')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Found coverage files: $FILES"

      - name: Upload coverage to Codecov
        if: steps.coverage.outputs.files != ''
        uses: codecov/codecov-action@v5
        with:
          files: ${{ steps.coverage.outputs.files }}
          disable_search: true
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Upload Artifacts
      - name: Upload native codec artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-codecs
          path: native/zig-out/
          retention-days: 7

      # NuGet Package (on tags only)
      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet pack --no-build --configuration Release -p:PackageVersion=${GITHUB_REF_NAME#v} -warnaserror
          # Validate package was created and contains expected assemblies
          NUPKG="src/SharpDicom/bin/Release/SharpDicom.${GITHUB_REF_NAME#v}.nupkg"
          if [ ! -f "$NUPKG" ]; then
            echo "::error::Package not found: $NUPKG"
            exit 1
          fi
          echo "Package contents:"
          unzip -l "$NUPKG"
          # Verify DLLs have embedded PDBs (file size check - embedded PDBs make DLLs larger)
          unzip -p "$NUPKG" "lib/net9.0/SharpDicom.dll" > /tmp/check.dll
          if [ $(stat -c%s /tmp/check.dll 2>/dev/null || stat -f%z /tmp/check.dll) -lt 100000 ]; then
            echo "::error::DLL suspiciously small - may be missing embedded symbols"
            exit 1
          fi
          echo "::notice::Package validated successfully"

      - name: Push to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "src/**/bin/Release/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      # Native AOT CLI binaries (Linux + Windows via Zig/xwin cross-compilation)
      - name: Publish AOT for Linux and Windows
        run: |
          for rid in linux-x64 linux-arm64 win-x64 win-arm64; do
            echo "::group::Publishing $rid"
            dotnet publish src/SharpDicom.Cli/SharpDicom.Cli.csproj -c Release -r $rid -o publish/$rid
            echo "::endgroup::"
          done

      - name: Archive binaries
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for rid in linux-x64 linux-arm64; do
            tar -czf sharpdcm-$rid.tar.gz -C publish/$rid .
          done
          for rid in win-x64 win-arm64; do
            (cd publish/$rid && zip -q ../../sharpdcm-$rid.zip *)
          done

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sharpdcm-*.tar.gz
            sharpdcm-*.zip

  release-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish AOT for macOS
        run: |
          for rid in osx-x64 osx-arm64; do
            echo "::group::Publishing $rid"
            dotnet publish src/SharpDicom.Cli/SharpDicom.Cli.csproj -c Release -r $rid -o publish/$rid
            echo "::endgroup::"
          done

      - name: Archive macOS binaries
        run: |
          for rid in osx-x64 osx-arm64; do
            tar -czf sharpdcm-$rid.tar.gz -C publish/$rid .
          done

      - name: Append macOS binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: sharpdcm-osx-*.tar.gz
